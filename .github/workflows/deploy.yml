name: Deploy to Azure

on:
  push:
    branches: [main, ci/deploy]
  workflow_dispatch:

# OIDC Permissions
permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: deployment-azure
    outputs:
      acrLoginServer: ${{ steps.bicep.outputs.acrLoginServer }}
      acrName: ${{ steps.bicep.outputs.acrName }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Current Image Tags
        id: current-images
        run: |
          SCHEDULER_IMAGE=$(az containerapp show -n ${{ vars.AZURE_PREFIX }}-scheduler -g ${{ vars.AZURE_RG }} --query properties.template.containers[0].image -o tsv 2>/dev/null || echo "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest")
          UI_IMAGE=$(az containerapp show -n ${{ vars.AZURE_PREFIX }}-ui -g ${{ vars.AZURE_RG }} --query properties.template.containers[0].image -o tsv 2>/dev/null || echo "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest")
          echo "schedulerImage=$SCHEDULER_IMAGE" >> $GITHUB_OUTPUT
          echo "uiImage=$UI_IMAGE" >> $GITHUB_OUTPUT

      - name: Create Azure Resources
        id: bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RG }}
          template: ./infra/main.bicep
          parameters: >
            pgAdminPassword=${{ secrets.PG_PASSWORD }} prefix=${{
            vars.AZURE_PREFIX }} schedulerImage=${{
            steps.current-images.outputs.schedulerImage }} uiImage=${{
            steps.current-images.outputs.uiImage }}
          failOnStdErr: false

  build-apps:
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: deployment-azure
    strategy:
      matrix:
        component: [scheduler, ui]
        include:
          - component: scheduler
            context: ./scheduler
          - component: ui
            context: ./ui/workload-scheduling-app
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ needs.deploy-infra.outputs.acrName }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ needs.deploy-infra.outputs.acrLoginServer }}/${{ matrix.component }}:${{ github.sha }}
            ${{ needs.deploy-infra.outputs.acrLoginServer }}/${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-apps:
    needs: [deploy-infra, build-apps]
    runs-on: ubuntu-latest
    environment: deployment-azure
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container Apps
        run: |
          az containerapp update -n ${{ vars.AZURE_PREFIX }}-scheduler -g ${{ vars.AZURE_RG }} --image ${{ needs.deploy-infra.outputs.acrLoginServer }}/scheduler:${{ github.sha }}
          az containerapp update -n ${{ vars.AZURE_PREFIX }}-ui -g ${{ vars.AZURE_RG }} --image ${{ needs.deploy-infra.outputs.acrLoginServer }}/ui:${{ github.sha }}
