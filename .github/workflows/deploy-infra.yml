name: Deploy Infrastructure

on:
  push:
    branches: [main, ci/deploy]
    paths:
      - "infra/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: deployment-azure
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Current Image Tags
        id: current-images
        run: |
          SCHEDULER_IMAGE=$(az containerapp show -n ${{ vars.AZURE_PREFIX }}-scheduler -g ${{ vars.AZURE_RG }} --query properties.template.containers[0].image -o tsv 2>/dev/null || echo "ealen/echo-server:latest")
          UI_IMAGE=$(az containerapp show -n ${{ vars.AZURE_PREFIX }}-ui -g ${{ vars.AZURE_RG }} --query properties.template.containers[0].image -o tsv 2>/dev/null || echo "ealen/echo-server:latest")

          # Replace old failing dummy image if it's currently set
          if [[ "$SCHEDULER_IMAGE" == "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" ]]; then SCHEDULER_IMAGE="ealen/echo-server:latest"; fi
          if [[ "$UI_IMAGE" == "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest" ]]; then UI_IMAGE="ealen/echo-server:latest"; fi

          echo "schedulerImage=$SCHEDULER_IMAGE" >> $GITHUB_OUTPUT
          echo "uiImage=$UI_IMAGE" >> $GITHUB_OUTPUT

      - name: Create Azure Resources
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ vars.AZURE_RG }}
          template: ./infra/main.bicep
          parameters: >
            pgAdminPassword=${{ secrets.PG_PASSWORD }} prefix=${{
            vars.AZURE_PREFIX }} schedulerImage=${{
            steps.current-images.outputs.schedulerImage }} uiImage=${{
            steps.current-images.outputs.uiImage }}
          failOnStdErr: false
