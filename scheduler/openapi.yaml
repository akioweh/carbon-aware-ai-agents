openapi: 3.0.3
info:
  title: Scheduler API (Prototype)
  description: |
    Simple API for carbon-aware AI workload scheduling.
    Submit a job specification and receive an optimized schedule.
  version: 0.1.0

servers:
  - url: http://localhost:6969
    description: Local development server

paths:
  /api/schedules/{schedule_id}:
    get:
      operationId: getScheduledJob
      summary:
        Fetch blocks of specific schedule. Optionally at a specific datacenter.
      description: Gets schedule by its schedule_id.
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successful response with specific schedule data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetailResponse"
        "400":
          description:
            Malformed request (e.g. missing or unparseable path parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid request (e.g. invalid schedule_id format or
            non-existent schedule_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteScheduledJob
      summary: Deletes specific schedule.
      description:
        Cause POST on this endpoint automatically persists the job, we need a
        way to delete it if user doesnt confirm it
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      responses:
        "204":
          description: Schedule deleted successfully
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/{schedule_id}/trivial:
    get:
      operationId: getScheduledJobTrivial
      summary:
        Fetch the unoptimized trivial schedule baseline for a specific schedule.
        Optionally at a specific datacenter.
      description: Gets the trivial schedule associated with a schedule_id.
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successful response with trivial schedule data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetailResponse"
        "400":
          description:
            Malformed request (e.g. missing or unparseable path parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid request (e.g. invalid schedule_id format or
            non-existent schedule_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/summary:
    get:
      operationId: getScheduleSummaries
      summary: Fetch schedule ids and impacts of all schedules.
      description: Gets all the schedule ids and impacts of all scheduled jobs.
      responses:
        "200":
          description: Successful response with schedule data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSummary"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules:
    get:
      operationId: getSchedule
      summary:
        Fetch blocks across different schedules. Optionally those which are
        inside the specific datacenter.
      description:
        gets all already-scheduled jobs (gets all blocks) which start after
        start_time and end before end_time. Those arguments are optional, so
        providing neither gives back the whole schedule.
      parameters:
        - $ref: "#/components/parameters/StartTimeParam"
        - $ref: "#/components/parameters/EndTimeParam"
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successful response with schedule data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid parameters (e.g. invalid date format,
            start_time after end_time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: scheduleJob
      summary: Create a Schedule
      description:
        Submit a job and get back an optimized schedule placement (only blocks
        of this new job)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "200":
          description: Schedule created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetailResponse"
        "400":
          description: Malformed request (e.g. missing or unparseable JSON body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Scheduling conflict: the request is valid but cannot be satisfied
            given the current system state (e.g. insufficient capacity across
            all locations, no available data centers, scheduling window too
            narrow or in the past)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid request body (e.g. missing required fields,
            invalid date format, non-positive workload_amount, latest_finish
            before earliest_start)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Connection to Python API failed in some way. This results in our
            service being no longer valid and available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    StartTimeParam:
      name: start_time
      in: query
      description: Only include blocks starting after this time
      required: false
      schema:
        type: string
        format: date-time
        description: Earliest time to start
        example: "2025-12-08T00:00:00Z"

    EndTimeParam:
      name: end_time
      in: query
      description: Only include blocks ending before this time
      required: false
      schema:
        type: string
        format: date-time
        description: Latest time to end
        example: "2025-12-08T00:00:00Z"

    ScheduleIdParam:
      name: schedule_id
      in: path
      description: id of a schedule
      required: true
      schema:
        type: string
        description: Id of a schedule returned by POST /api/schedule.
        example: "Sche_123"

    DatacenterLocationParam:
      name: datacenter
      in: query
      description: Location of datacenter that is being queried
      required: false
      schema:
        type: string
        description: Fetches blocks only from this specific Datacenter
        example: "Data-Center-1"

  schemas:
    JobRequest:
      type: object
      required:
        - job_type
        - workload_amount
        - earliest_start
        - latest_finish
      properties:
        job_type:
          type: string
          description: Type of AI workload
          enum: ["training", "inference", "batch"]
          example: "training"
        workload_amount:
          type: number
          description: Amount of workload in the specified functional unit
          minimum: 0
          exclusiveMinimum: true
          example: 20
        earliest_start:
          type: string
          format: date-time
          description: Earliest time to start
          example: "2025-12-08T00:00:00Z"
        latest_finish:
          type: string
          format: date-time
          description: Latest time to finish (must be after earliest_start)
          example: "2025-12-10T00:00:00Z"
        additional_constraints:
          type: object
          additionalProperties: true
        preferred_datacenter:
          type: string
          description: Optional preferred datacenter to prioritize allocating work on if possible (useful for trivial scheduler baseline comparisons)
          example: "us-west-1"

    ScheduleResponse:
      type: array
      items:
        $ref: "#/components/schemas/ScheduleBlock"

    ScheduleBlock:
      type: object
      required:
        - timestamp
        - location
        - schedule_id
        - additional_load
      properties:
        timestamp:
          type: string
          format: date-time
          description: Start time of the scheduled block
          example: "2025-12-08T02:00:00Z"
        location:
          type: string
          description:
            Location of a datacenter in which this block has been scheduled.
          example: "us-west-1"
        schedule_id:
          type: string
          description: Identifier telling to which schedule this block belongs.
          example: "shed-456"
        additional_load:
          type: number
          description: Additional load in kWh during this block
          example: 5.0

    ScheduleSummary:
      type: object
      description: Includes schedule id and impacts of that schedule
      required:
        - schedule_id
        - impact
      properties:
        schedule_id:
          $ref: "#/components/schemas/ScheduleDetailResponse/properties/schedule_id"
        impact:
          $ref: "#/components/schemas/ScheduleDetailResponse/properties/impact"

    ScheduleDetailResponse:
      type: object
      description:
        Response after scheduling a job, indicating success and server-assigned
        schedule ID
      required:
        - schedule_id
        - scheduled_blocks
        - impact
      properties:
        schedule_id:
          type: string
          description: assigned id for the job
          example: "sched-456"
        message:
          type: string
          nullable: true
          description: optional message from the server
        scheduled_blocks:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleBlock"
        impact:
          type: object
          properties:
            carbon_intensity:
              type: number
              description:
                average carbon intensity during the scheduled period in kg
                CO2/kWh
              example: 50.0
            total_emissions:
              type: number
              description: total predicted emissions in kg CO2
              example: 0.14
            sci:
              type: number
              description: Software Carbon Intensity score for the schedule
              example: 20

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Invalid job specification"
