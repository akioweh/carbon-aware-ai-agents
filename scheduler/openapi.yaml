openapi: 3.0.3
info:
  title: Scheduler API (Prototype)
  description: |
    Simple API for carbon-aware AI workload scheduling.
    Submit a job specification and receive an optimized schedule.
  version: 0.1.0

servers:
  - url: http://localhost:6969
    description: Local development server

paths:
  /api/schedules/{schedule_id}:
    get:
      operationId: getScheduledJob
      summary:
        Fetch blocks of specific schedule. Optionally at a specific datacenter.
      description: Gets schedule by its schedule_id.
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successful response with specific schedule data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetailResponse"
        "400":
          description:
            Malformed request (e.g. missing or unparseable path parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid request (e.g. invalid schedule_id format or
            non-existent schedule_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteScheduledJob
      summary: Deletes specific schedule.
      description:
        Cause POST on this endpoint automatically persists the job, we need a
        way to delete it if user doesnt confirm it
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
      responses:
        "204":
          description: Schedule deleted successfully
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/{schedule_id}/trivial:
    get:
      operationId: getScheduledJobTrivial
      summary:
        Fetch the unoptimized trivial schedule baseline for a specific schedule.
        Optionally at a specific datacenter.
      description: Gets the trivial schedule associated with a schedule_id.
      parameters:
        - $ref: "#/components/parameters/ScheduleIdParam"
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successful response with trivial schedule data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleData"
        "400":
          description:
            Malformed request (e.g. missing or unparseable path parameter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid request (e.g. invalid schedule_id format or
            non-existent schedule_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules/summary:
    get:
      operationId: getScheduleSummaries
      summary: Fetch schedule ids and impacts of all schedules.
      description: Gets all the schedule ids and impacts of all scheduled jobs.
      responses:
        "200":
          description: Successful response with schedule data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleSummary"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules:
    get:
      operationId: getSchedule
      summary:
        Fetch blocks across different schedules. Optionally those which are
        inside the specific datacenter.
      description:
        gets all already-scheduled jobs (gets all blocks) which start after
        start_time and end before end_time. Those arguments are optional, so
        providing neither gives back the whole schedule.
      parameters:
        - $ref: "#/components/parameters/StartTimeParam"
        - $ref: "#/components/parameters/EndTimeParam"
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successful response with schedule data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid parameters (e.g. invalid date format,
            start_time after end_time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: scheduleJob
      summary: Create a Schedule
      description: Submit a job and get back a schedule ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "200":
          description: Schedule created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCreatedResponse"
        "400":
          description: Malformed request (e.g. missing or unparseable JSON body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Scheduling conflict: the request is valid but cannot be satisfied
            given the current system state (e.g. insufficient capacity across
            all locations, no available data centers, scheduling window too
            narrow or in the past)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Semantically invalid request body (e.g. missing required fields,
            invalid date format, latest_finish before earliest_start)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Connection to Python API failed in some way. This results in our
            service being no longer valid and available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forecast:
    get:
      operationId: GetForecast
      summary: Gets forcast from python API.
      description:
        Gets full forecast for a specific datacenter, or for all depending on
        whether datacenter location is provided.
      parameters:
        - $ref: "#/components/parameters/DatacenterLocationParam"
      responses:
        "200":
          description: Successfull response with requested datacenter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DCInfo"
        "400":
          description: Python API is unresponsive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/hardwareSpecs/gpus:
    get:
      operationId: getGpuSpecs
      summary: Gets available GPU specs
      description: Lists GPUs convertible to functional units of computation.
      responses:
        "200":
          description: Successful response with requested GPU list.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "V100_PCIE"
                  - "A100_SXM4"

components:
  parameters:
    StartTimeParam:
      name: start_time
      in: query
      description: Only include blocks starting after this time
      required: false
      schema:
        type: string
        format: date-time
        description: Earliest time to start
        example: "2025-12-08T00:00:00Z"

    EndTimeParam:
      name: end_time
      in: query
      description: Only include blocks ending before this time
      required: false
      schema:
        type: string
        format: date-time
        description: Latest time to end
        example: "2025-12-08T00:00:00Z"

    ScheduleIdParam:
      name: schedule_id
      in: path
      description: id of a schedule
      required: true
      schema:
        type: string
        description: Id of a schedule returned by POST /api/schedule.
        example: "Sche_123"

    DatacenterLocationParam:
      name: datacenter
      in: query
      description: Location of datacenter that is being queried
      required: false
      schema:
        type: string
        description: Fetches blocks only from this specific Datacenter
        example: "Data-Center-1"

  schemas:
    JobRequest:
      type: object
      required:
        - job_type
        - earliest_start
        - latest_finish
        - gpu_type
        - length
        - gpu_count
        - model_size
      properties:
        job_type:
          type: string
          description: Type of AI workload
          enum: ["training", "inference", "batch"]
          example: "training"
        earliest_start:
          type: string
          format: date-time
          description: Earliest time to start
          example: "2025-12-08T00:00:00Z"
        latest_finish:
          type: string
          format: date-time
          description: Latest time to finish (must be after earliest_start)
          example: "2025-12-10T00:00:00Z"
        additional_constraints:
          type: object
          additionalProperties: true
        preferred_datacenter:
          type: string
          description:
            Optional preferred datacenter to prioritize allocating work on if
            possible (useful for trivial scheduler baseline comparisons)
          example: "us-west-1"
        gpu_type:
          type: string
          description: type of available gpu to the user.
          example: "V100_PCIE"
        length:
          type: integer
          description: esitmated time of the work in minutes
          example: 20
        gpu_count:
          type: integer
          description: number of available gpus.
          example: 5
        model_size:
          type: integer
          description:
            size of the model to train in GBs. This means how much VRam is
            needed for it to run.
          example: 26

    ScheduleResponse:
      type: array
      items:
        $ref: "#/components/schemas/ScheduleBlock"

    ScheduleBlock:
      type: object
      required:
        - timestamp
        - location
        - schedule_id
        - additional_load
      properties:
        timestamp:
          type: string
          format: date-time
          description: Start time of the scheduled block
          example: "2025-12-08T02:00:00Z"
        location:
          type: string
          description:
            Location of a datacenter in which this block has been scheduled.
          example: "us-west-1"
        schedule_id:
          type: string
          description: Identifier telling to which schedule this block belongs.
          example: "shed-456"
        additional_load:
          type: number
          description: Additional load in kWh during this block
          example: 5.0

    ScheduleSummary:
      type: object
      description: Includes schedule id and impacts of that schedule
      required:
        - schedule_id
        - impact
      properties:
        schedule_id:
          type: string
          description: assigned id for the job
          example: "sched-456"
        impact:
          $ref: "#/components/schemas/ScheduleImpact"
        trivialImpact:
          $ref: "#/components/schemas/ScheduleImpact"
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        locations:
          type: array
          items:
            type: string
        total_load:
          type: number
        block_count:
          type: integer

    ScheduleDetailResponse:
      type: object
      description: Response when fetching a scheduled job
      required:
        - schedule_id
        - scheduled_blocks
        - impact
      properties:
        schedule_id:
          type: string
          description: assigned id for the job
          example: "sched-456"
        message:
          type: string
          nullable: true
          description: optional message from the server
        scheduled_blocks:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleBlock"
        impact:
          $ref: "#/components/schemas/ScheduleImpact"

    ScheduleCreatedResponse:
      type: object
      description: Response after successfully submitting a job request
      required:
        - schedule_id
        - message
      properties:
        schedule_id:
          type: string
          description: assigned id for the newly created job
          example: "sched-456"
        message:
          type: string
          description: status message
          example: "Success"

    ScheduleData:
      type: object
      required:
        - schedule_id
        - scheduled_blocks
        - impact
      properties:
        schedule_id:
          type: string
        scheduled_blocks:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleBlock"
        impact:
          $ref: "#/components/schemas/ScheduleImpact"

    ScheduleImpact:
      type: object
      properties:
        carbon_intensity:
          type: number
          description:
            average carbon intensity during the scheduled period in gCO2eq/kWh
          example: 50.0
        total_emissions:
          type: number
          description: total predicted emissions in gCO2eq
          example: 140.0
        sci:
          type: number
          description: Software Carbon Intensity score for the schedule
          example: 20

    DCInfoHardwareSpec:
      type: object
      properties:
        gpuSKU:
          type: string
          description: SKU of the GPU available
          example: "V100_PCIE"
        gpuCapacity:
          type: number
          description: Computational capacity of the GPU in teraFLOPS
          example: 40
        gpuPower:
          type: number
          description: Power consumption of the GPU in watts
          example: 250

    DCInfo:
      properties:
        location:
          type: string
          title: location
          description: location of the greeness data
        hardwareSpec:
          $ref: "#/components/schemas/DCInfoHardwareSpec"
        timeseries:
          type: array
          items:
            $ref: "#/components/schemas/DCInfoTSDataPoint"
      type: object
      required:
        - location
        - timeseries

    DCInfoTSDataPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Start time of the scheduled block
          example: "2025-12-08T02:00:00Z"
        load:
          type: number
          description: load at the location at the time, in FLOs
          example: 1e14
        carbon_intensity:
          type: number
          description: carbon intensity at the location at the time
          example: 50.0
        capacity:
          type: number
          description:
            computational capacity available at the location at the time in FLOs
          example: 1e15

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "Invalid job specification"
