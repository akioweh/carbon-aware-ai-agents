openapi: 3.0.3
info:
  title: Stats API (Stats Component)
  description: |
    API for carbon-aware scheduling predictions.
    
    ## Available Endpoints
    
    - `/datacenters` - List of available datacenter names
    - `/locations/{location}/metrics/forecast_greenness` - Next week greenness predictions (cached 5 min)
    - `/locations/{location}/metrics/forecast_load` - Next week load predictions (cached 5 min)
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Datacenters
    description: Datacenter information
  - name: Forecasts
    description: ML-based predictions for load and greenness metrics

paths:
  /datacenters:
    get:
      tags:
        - Datacenters
      summary: Get datacenter names
      description: Returns a list of available datacenter names
      operationId: getDatacenterNames
      responses:
        '200':
          description: List of datacenter names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - "dc1"
                - "dc2"
                - "dc3"

  /locations/{location}/metrics/forecast_greenness:
    get:
      tags:
        - Forecasts
      summary: Get greenness forecast for next week
      description: |
        Returns ML-generated greenness predictions for the next week.
        Results are cached for 5 minutes.
      parameters:
        - name: location
          in: path
          required: true
          description: Datacenter identifier
          schema:
            type: string
          example: "dc1"
      responses:
        '200':
          description: Greenness forecast for next week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '500':
          description: Error generating forecast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /locations/{location}/metrics/forecast_load:
    get:
      tags:
        - Forecasts
      summary: Get load forecast for next week
      description: |
        Returns ML-generated load predictions for the next week.
        Results are cached for 5 minutes.
      parameters:
        - name: location
          in: path
          required: true
          description: Datacenter identifier
          schema:
            type: string
          example: "dc1"
      responses:
        '200':
          description: Load forecast for next week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '500':
          description: Error generating forecast
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ForecastResponse:
      type: object
      description: |
        ML-generated forecast response.
        Structure depends on the predictor implementation.
        Cached for 5 minutes to avoid redundant ML predictions.
      additionalProperties: true
      example:
        location_id: "dc1"
        metric: "load"
        predictions: []
    
    Error:
      type: object
      description: Error response
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Data centre 'dc1' not found"
