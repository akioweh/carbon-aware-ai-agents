openapi: 3.1.0
info:
  title: Stats API
  description: Statistics provider for carbon-aware scheduling predictions.
  version: 1.0.0
paths:
  /locations/{location}/metrics/forecast_load:
    get:
      tags:
      - Forecasts
      summary: Get load forecast for next week
      operationId: get_load_forecast_locations__location__metrics_forecast_load_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations/{location}/metrics/forecast_greenness:
    get:
      tags:
      - Forecasts
      summary: Get greenness forecast for next week
      description: 'Returns ML-generated greenness predictions for the next week.

        Results are cached for 5 minutes.'
      operationId: get_carbon_forecast_locations__location__metrics_forecast_greenness_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreennessForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations/{location}/metrics/forecast_carbon_intensity:
    get:
      tags:
      - Forecasts
      summary: Get carbon intensity forecast for next week
      description: 'Returns SARIMAX-generated carbon intensity predictions (gCO2/kWh)
        for the next week.

        Results are cached for 5 minutes.'
      operationId: get_carbon_intensity_forecast_locations__location__metrics_forecast_carbon_intensity_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonIntensityForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found or no carbon intensity data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations:
    get:
      tags:
      - Locations
      summary: Get available locations
      description: Returns a list of available locations.
      operationId: get_locations_locations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Location'
                type: array
                title: Response Get Locations Locations Get
          links:
            GetLoadForecast:
              operationId: get_load_forecast_locations__location__metrics_forecast_load_get
              parameters:
                location: $response.body#/0/id
              description: Get load forecast for a location from the list
            GetGreennessForecast:
              operationId: get_carbon_forecast_locations__location__metrics_forecast_greenness_get
              parameters:
                location: $response.body#/0/id
              description: Get greenness forecast for a location from the list
            GetCarbonIntensityForecast:
              operationId: get_carbon_intensity_forecast_locations__location__metrics_forecast_carbon_intensity_get
              parameters:
                location: $response.body#/0/id
              description: Get carbon intensity forecast for a location from the list
components:
  schemas:
    Capacity:
      properties:
        max_load:
          type: number
          title: Max Load
          description: Maximum load capacity
        total_gpus:
          type: integer
          title: Total Gpus
          description: Total number of GPUs
      type: object
      required:
      - max_load
      - total_gpus
      title: Capacity
    CarbonIntensityForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      title: CarbonIntensityForecastDataPoint
    CarbonIntensityForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_greenness)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        data:
          items:
            $ref: '#/components/schemas/CarbonIntensityForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: CarbonIntensityForecastResponse
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
      type: object
      required:
      - error
      title: ErrorResponse
    GreennessForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      title: GreennessForecastDataPoint
    GreennessForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_greenness)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        data:
          items:
            $ref: '#/components/schemas/GreennessForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: GreennessForecastResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoadForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
        available_gpus:
          type: integer
          title: Available Gpus
          description: Number of available GPUs
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      - available_gpus
      title: LoadForecastDataPoint
    LoadForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_greenness)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        capacity:
          $ref: '#/components/schemas/Capacity'
          description: Capacity information
        data:
          items:
            $ref: '#/components/schemas/LoadForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - capacity
      - data
      title: LoadForecastResponse
    Location:
      properties:
        id:
          type: string
          title: Id
          description: Location identifier
        name:
          type: string
          title: Name
          description: Human-readable name
      type: object
      required:
      - id
      - name
      title: Location
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
