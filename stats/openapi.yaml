openapi: 3.1.0
info:
  title: Stats API
  description: Statistics provider for carbon-aware scheduling predictions.
  version: 1.0.0
paths:
  /locations/{location}/metrics/forecast_load:
    get:
      tags:
      - Forecasts
      summary: Get load forecast for next week
      operationId: get_load_forecast_locations__location__metrics_forecast_load_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations/{location}/metrics/forecast_carbon_intensity:
    get:
      tags:
      - Forecasts
      summary: Get carbon intensity forecast for next week
      description: 'Returns ML-generated carbon intensity predictions for the next
        week.

        Results are cached for 5 minutes.'
      operationId: get_carbon_forecast_locations__location__metrics_forecast_carbon_intensity_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonIntensityForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /predictionWindow:
    get:
      tags:
      - PredictionWindowLength
      summary: Returns prediction window length in hours to the future.
      operationId: handle_get_prediction_window_predictionWindow_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionWindowModel'
  /locations:
    get:
      tags:
      - Locations
      summary: Get available locations
      description: Returns a list of available locations.
      operationId: get_locations_locations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Location'
                type: array
                title: Response Get Locations Locations Get
          links:
            GetLoadForecast:
              operationId: get_load_forecast_locations__location__metrics_forecast_load_get
              parameters:
                location: $response.body#/0/id
              description: Get load forecast for a location from the list
            GetCarbonIntensityForecast:
              operationId: get_carbon_forecast_locations__location__metrics_forecast_carbon_intensity_get
              parameters:
                location: $response.body#/0/id
              description: Get carbon intensity forecast for a location from the list
components:
  schemas:
    BaseForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      title: BaseForecastDataPoint
    CarbonIntensityForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_carbon_intensity)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        data:
          items:
            $ref: '#/components/schemas/BaseForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: CarbonIntensityForecastResponse
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
      type: object
      required:
      - error
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoadForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
        capacity:
          type: number
          title: Capacity
          description: Capacity in FLOs
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      - capacity
      title: LoadForecastDataPoint
    LoadForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_carbon_intensity)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        data:
          items:
            $ref: '#/components/schemas/LoadForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: LoadForecastResponse
    Location:
      properties:
        id:
          type: string
          title: Id
          description: Location identifier
        name:
          type: string
          title: Name
          description: Human-readable name
      type: object
      required:
      - id
      - name
      title: Location
    PredictionWindowModel:
      properties:
        windowLengthHours:
          type: integer
          title: Windowlengthhours
      type: object
      required:
      - windowLengthHours
      title: PredictionWindowModel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
