openapi: 3.0.3
info:
  title: Stats API (Stats Component)
  description: |
    API for environmental and operational time-series data to support carbon-aware scheduling.
    
    ## Design Philosophy
    
    All metrics follow a **normalized time-series structure** with:
    - Location-based hierarchy: `/locations/{location}/metrics/{metric}`
    - Unified query parameters: `start`, `end`, `include_forecast`
    - Consistent response format with metadata (location, metric, unit)
    - Clear distinction between historical data and forecasts (`is_forecast` flag)
    
    ## Available Endpoints
    
    - **forecast_greenness**: Grid carbon intensity forecasting
    - **forecast_load**: Data center load and capacity tracking
    - **datacenters**: List of available datacenter names
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Context
    description: |
      Unified location-based metrics API.
      All metrics follow the same time-series structure and query patterns.

paths:
  /datacenters:
    get:
      tags:
        - Context
      summary: Get datacenter names
      description: Returns a list of available datacenter names
      operationId: getDatacenterNames
      responses:
        '200':
          description: List of datacenter names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example:
                - "dc1"
                - "dc2"
                - "dc3"

  /locations/{location}/metrics/forecast_greenness:
    get:
      tags:
        - Context
      summary: Get carbon intensity data
      description: |
        Returns grid carbon intensity time-series data for a location.
        Supports historical data and future forecasts.
      parameters:
        - name: location
          in: path
          required: true
          description: Location identifier (use 'all' for all locations)
          schema:
            type: string
          example: "dc1"
        - name: start
          in: query
          description: Start time (ISO 8601). Defaults to current time if forecasting, or 24h ago if historical.
          schema:
            type: string
            format: date-time
          example: "2025-12-08T00:00:00Z"
        - name: end
          in: query
          description: End time (ISO 8601). Defaults to 24h from start.
          schema:
            type: string
            format: date-time
          example: "2025-12-09T00:00:00Z"
        - name: include_forecast
          in: query
          description: Include forecast data beyond current time
          schema:
            type: boolean
            default: true
          example: true
      responses:
        '200':
          description: Carbon intensity time-series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricTimeSeries'
              example:
                location_id: "dc1"
                metric: "carbon_intensity"
                unit: "kg_co2_per_kwh"
                data:
                  - timestamp: "2025-12-08T00:00:00Z"
                    value: 0.25
                  - timestamp: "2025-12-08T01:00:00Z"
                    value: 0.22
                  - timestamp: "2025-12-08T02:00:00Z"
                    value: 0.15

  /locations/{location}/metrics/forecast_load:
    get:
      tags:
        - Context
      summary: Get data center load data
      description: |
        Returns data center load and capacity time-series data.
        Includes current load, capacity, and available resources.
      parameters:
        - name: location
          in: path
          required: true
          description: Location identifier
          schema:
            type: string
          example: "dc1"
        - name: start
          in: query
          description: Start time (ISO 8601). Defaults to 24h ago.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: End time (ISO 8601). Defaults to now.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Load time-series with capacity info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadMetricTimeSeries'
              example:
                location_id: "dc1"
                metric: "load"
                unit: "utilization_units"
                capacity:
                  max_load: 50.0
                  total_gpus: 32
                data:
                  - timestamp: "2025-12-08T00:00:00Z"
                    value: 25.5
                    available_gpus: 16
                  - timestamp: "2025-12-08T01:00:00Z"
                    value: 28.0
                    available_gpus: 14

components:
  schemas:
    MetricTimeSeries:
      type: object
      description: |
        Unified time-series structure for metrics.
        All time-series data follows this normalized format.
      required:
        - location_id
        - metric
        - unit
        - data
      properties:
        location_id:
          type: string
          description: Location identifier
          example: "dc1"
        metric:
          type: string
          description: Metric name
          example: "carbon_intensity"
        unit:
          type: string
          description: Unit of measurement
          example: "kg_co2_per_kwh"
        data:
          type: array
          description: Time-series data points
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
    
    TimeSeriesPoint:
      type: object
      description: A single point in a time-series
      required:
        - timestamp
        - value
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time of measurement or forecast
          example: "2025-12-08T00:00:00Z"
        value:
          type: number
          description: Metric value at this time
          example: 0.25
        is_forecast:
          type: boolean
          description: Whether this is a forecast (future) or historical/current data
          default: false
          example: true
    
    LoadMetricTimeSeries:
      type: object
      description: Load time-series with capacity information
      required:
        - location_id
        - metric
        - unit
        - capacity
        - data
      properties:
        location_id:
          type: string
          example: "dc1"
        metric:
          type: string
          example: "load"
        unit:
          type: string
          example: "utilization_units"
        capacity:
          $ref: '#/components/schemas/CapacityInfo'
        data:
          type: array
          items:
            $ref: '#/components/schemas/LoadTimeSeriesPoint'
    
    CapacityInfo:
      type: object
      description: Capacity limits for a location
      properties:
        max_load:
          type: number
          description: Maximum load capacity
          example: 50.0
        total_gpus:
          type: integer
          description: Total number of GPUs
          example: 32
    
    LoadTimeSeriesPoint:
      type: object
      description: Load data point with resource availability
      required:
        - timestamp
        - value
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2025-12-08T00:00:00Z"
        value:
          type: number
          description: Load value
          example: 25.5
        available_gpus:
          type: integer
          description: Number of GPUs available at this time
          example: 16
