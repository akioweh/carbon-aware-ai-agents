openapi: 3.1.0
info:
  title: Carbon-Aware Forecasting Service
  description: Provides load and carbon intensity forecasts for data center locations.
    Forecasts are generated using Ridge regression models trained on historical UK
    Carbon Intensity API data and weather features from Open-Meteo. All forecasts
    cover a 7-day window at 5-minute resolution (2016 data points).
  version: 1.0.0
paths:
  /locations/{location}/metrics/forecast_load:
    get:
      tags:
      - Forecasts
      summary: Load forecast for a location
      description: Returns a 7-day load forecast at 5-minute resolution (2016 data
        points). Each point includes the predicted load and the datacenter capacity
        in FLOs. Results are cached and refreshed every 30 minutes.
      operationId: get_load_forecast_locations__location__metrics_forecast_load_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadForecastResponse'
        '404':
          description: No historical data for this location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Prediction generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations/{location}/metrics/forecast_carbon_intensity:
    get:
      tags:
      - Forecasts
      summary: Carbon intensity forecast for a location
      description: Returns a 7-day carbon intensity forecast at 5-minute resolution
        (2016 data points) in gCO2/kWh. Uses Ridge regression trained on UK Carbon
        Intensity API data with weather exogenous features. Results are cached and
        refreshed every 30 minutes.
      operationId: get_carbon_forecast_locations__location__metrics_forecast_carbon_intensity_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonIntensityForecastResponse'
        '404':
          description: No carbon intensity data for this location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Prediction generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /predictionWindow:
    get:
      tags:
      - Configuration
      summary: Prediction window length
      description: Returns the forecast window length in hours. Currently fixed at
        168 hours (7 days).
      operationId: handle_get_prediction_window_predictionWindow_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionWindowModel'
  /locations:
    get:
      tags:
      - Locations
      summary: Active locations
      description: Returns locations that are currently active and visible to the
        scheduler. Use a location ID from this list to query forecast endpoints.
      operationId: get_locations_locations_get
      responses:
        '200':
          description: List of active locations
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Location'
                type: array
                title: Response Get Locations Locations Get
          links:
            GetLoadForecast:
              operationId: get_load_forecast_locations__location__metrics_forecast_load_get
              parameters:
                location: $response.body#/0/id
              description: Get load forecast for a location from the list
            GetCarbonIntensityForecast:
              operationId: get_carbon_forecast_locations__location__metrics_forecast_carbon_intensity_get
              parameters:
                location: $response.body#/0/id
              description: Get carbon intensity forecast for a location from the list
  /datacenters:
    get:
      tags:
      - Datacenters
      summary: All datacenters
      description: Returns all known datacenters (active and inactive) with their
        region metadata and coordinates. Used by the UI for datacenter management.
      operationId: get_datacenters_datacenters_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Datacenter'
                type: array
                title: Response Get Datacenters Datacenters Get
  /datacenters/{location_id}:
    patch:
      tags:
      - Datacenters
      summary: Toggle datacenter active state
      description: Activates or deactivates a datacenter. Active datacenters appear
        in /locations and receive scheduled forecasts.
      operationId: patch_datacenter_datacenters__location_id__patch
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          title: Location Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datacenter'
        '404':
          description: Datacenter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to reload datacenter after update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BaseForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO 8601 timestamp
          examples:
          - '2026-03-18T12:00:00'
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Always true for forecast endpoints
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      title: BaseForecastDataPoint
    CarbonIntensityForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
          examples:
          - Data-Center-1
        metric:
          type: string
          title: Metric
          description: Metric name
          examples:
          - forecast_load
          - forecast_carbon_intensity
        unit:
          type: string
          title: Unit
          description: Unit of measurement
          examples:
          - FLOs
          - gCO2/kWh
        data:
          items:
            $ref: '#/components/schemas/BaseForecastDataPoint'
          type: array
          title: Data
          description: 2016-point time series (7 days at 5-min intervals)
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: CarbonIntensityForecastResponse
    Datacenter:
      properties:
        id:
          type: string
          title: Id
          description: Location identifier
          examples:
          - Data-Center-1
        region_id:
          type: integer
          title: Region Id
          description: UK Carbon Intensity API region ID
          examples:
          - 13
        name:
          type: string
          title: Name
          description: Human-readable region name
          examples:
          - London
        active:
          type: boolean
          title: Active
          description: Whether this datacenter is visible to the scheduler
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude for weather lookups and map display
          examples:
          - 51.51
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude for weather lookups and map display
          examples:
          - -0.13
      type: object
      required:
      - id
      - region_id
      - name
      - active
      title: Datacenter
    DatacenterPatchRequest:
      properties:
        active:
          type: boolean
          title: Active
          description: New active state for this datacenter
      type: object
      required:
      - active
      title: DatacenterPatchRequest
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Error description
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoadForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO 8601 timestamp
          examples:
          - '2026-03-18T12:00:00'
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Always true for forecast endpoints
        capacity:
          type: number
          title: Capacity
          description: Max computational capacity at this interval (FLOs)
          examples:
          - 9.84e+17
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      - capacity
      title: LoadForecastDataPoint
    LoadForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
          examples:
          - Data-Center-1
        metric:
          type: string
          title: Metric
          description: Metric name
          examples:
          - forecast_load
          - forecast_carbon_intensity
        unit:
          type: string
          title: Unit
          description: Unit of measurement
          examples:
          - FLOs
          - gCO2/kWh
        data:
          items:
            $ref: '#/components/schemas/LoadForecastDataPoint'
          type: array
          title: Data
          description: 2016-point time series (7 days at 5-min intervals)
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: LoadForecastResponse
    Location:
      properties:
        id:
          type: string
          title: Id
          description: Location identifier
          examples:
          - Data-Center-1
        name:
          type: string
          title: Name
          description: Human-readable region name
          examples:
          - London
      type: object
      required:
      - id
      - name
      title: Location
    PredictionWindowModel:
      properties:
        windowLengthHours:
          type: integer
          title: Windowlengthhours
          description: Forecast window length in hours
          examples:
          - 168
      type: object
      required:
      - windowLengthHours
      title: PredictionWindowModel
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
