openapi: 3.1.0
info:
  title: Stats API
  description: Statistics provider for carbon-aware scheduling predictions.
  version: 1.0.0
paths:
  /locations/{location}/metrics/forecast_load:
    get:
      tags:
      - Forecasts
      summary: Get load forecast for next week
      operationId: get_load_forecast_locations__location__metrics_forecast_load_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations/{location}/metrics/forecast_carbon_intensity:
    get:
      tags:
      - Forecasts
      summary: Get carbon intensity forecast for next week
      description: 'Returns ML-generated carbon intensity predictions for the next
        week.

        Results are cached for 5 minutes.'
      operationId: get_carbon_forecast_locations__location__metrics_forecast_carbon_intensity_get
      parameters:
      - name: location
        in: path
        required: true
        schema:
          type: string
          title: Location
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarbonIntensityForecastResponse'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /locations:
    get:
      tags:
      - Locations
      summary: Get available locations
      description: Returns active locations for scheduler consumption.
      operationId: get_locations_locations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Location'
                type: array
                title: Response Get Locations Locations Get
          links:
            GetLoadForecast:
              operationId: get_load_forecast_locations__location__metrics_forecast_load_get
              parameters:
                location: $response.body#/0/id
              description: Get load forecast for a location from the list
            GetCarbonIntensityForecast:
              operationId: get_carbon_forecast_locations__location__metrics_forecast_carbon_intensity_get
              parameters:
                location: $response.body#/0/id
              description: Get carbon intensity forecast for a location from the list
  /datacenters:
    get:
      tags:
      - Datacenters
      summary: Get all datacenters and active state
      description: Returns all known datacenters and active state for UI management.
      operationId: get_datacenters_datacenters_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Datacenter'
                type: array
                title: Response Get Datacenters Datacenters Get
  /datacenters/{location_id}:
    patch:
      tags:
      - Datacenters
      summary: Update datacenter active state
      description: Updates whether a datacenter is active for scheduler-visible locations.
      operationId: patch_datacenter_datacenters__location_id__patch
      parameters:
      - name: location_id
        in: path
        required: true
        schema:
          type: string
          title: Location Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatacenterPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datacenter'
        '404':
          description: Datacenter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BaseForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      title: BaseForecastDataPoint
    CarbonIntensityForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_carbon_intensity)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        data:
          items:
            $ref: '#/components/schemas/BaseForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: CarbonIntensityForecastResponse
    Datacenter:
      properties:
        id:
          type: string
          title: Id
          description: Location identifier
        region_id:
          type: integer
          title: Region Id
          description: UK Carbon Intensity API region ID
        name:
          type: string
          title: Name
          description: Human-readable region/location name
        active:
          type: boolean
          title: Active
          description: Whether scheduler-visible location is enabled
        latitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Latitude
          description: Latitude used for weather and map display
        longitude:
          anyOf:
          - type: number
          - type: 'null'
          title: Longitude
          description: Longitude used for weather and map display
      type: object
      required:
      - id
      - region_id
      - name
      - active
      title: Datacenter
    DatacenterPatchRequest:
      properties:
        active:
          type: boolean
          title: Active
          description: New active state for this datacenter
      type: object
      required:
      - active
      title: DatacenterPatchRequest
    ErrorResponse:
      properties:
        error:
          type: string
          title: Error
      type: object
      required:
      - error
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoadForecastDataPoint:
      properties:
        timestamp:
          type: string
          title: Timestamp
          description: ISO format timestamp
        value:
          type: number
          title: Value
          description: Forecasted value
        is_forecast:
          type: boolean
          title: Is Forecast
          description: Indicates if this is a forecast
        capacity:
          type: number
          title: Capacity
          description: Capacity in FLOs
      type: object
      required:
      - timestamp
      - value
      - is_forecast
      - capacity
      title: LoadForecastDataPoint
    LoadForecastResponse:
      properties:
        location_id:
          type: string
          title: Location Id
          description: Datacenter identifier
        metric:
          type: string
          title: Metric
          description: Metric name (e.g. forecast_load, forecast_carbon_intensity)
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        data:
          items:
            $ref: '#/components/schemas/LoadForecastDataPoint'
          type: array
          title: Data
          description: Time series data
      type: object
      required:
      - location_id
      - metric
      - unit
      - data
      title: LoadForecastResponse
    Location:
      properties:
        id:
          type: string
          title: Id
          description: Location identifier
        name:
          type: string
          title: Name
          description: Human-readable name
      type: object
      required:
      - id
      - name
      title: Location
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
