# docker-compose.release.yml
# Use REPO_OWNER to ose tthe GitHub username/org if you've forked it.

services:
  db:
    image: postgres:17-alpine
    container_name: calendar-db
    environment:
      POSTGRES_DB: calendar_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Note: init.sql still needs to be present or the schema won't be created.
      # For a truly standalone run, you might want to bake the schema into a custom DB image.
      - ./scheduler/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  stats:
    image: ghcr.io/${REPO_OWNER:-akioweh}/carbon-aware-ai-agents/stats:latest
    container_name: stats
    environment:
      - STATS_PORT=5000
      - STATS_HOST=0.0.0.0
    ports:
      - "${STATS_HOST_PORT:-5000}:5000"

  scheduler:
    image: ghcr.io/${REPO_OWNER:-akioweh}/carbon-aware-ai-agents/scheduler:latest
    container_name: scheduler
    environment:
      - PORT=6969
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=calendar_db
      - PGUSER=postgres
      - PGPASSWORD=123
      - STATS_API_URL=${STATS_API_URL:-http://stats:5000}
    ports:
      - "${SCHEDULER_HOST_PORT:-6970}:6969"
    depends_on:
      db:
        condition: service_healthy
      stats:
        condition: service_started

  ui:
    image: ghcr.io/${REPO_OWNER:-akioweh}/carbon-aware-ai-agents/ui:latest
    container_name: ui
    environment:
      - SCHEDULER_API_URL=http://scheduler:6969
      - STATS_API_URL=${STATS_API_URL:-http://stats:5000}
    ports:
      - "${UI_HOST_PORT:-8080}:3000"
    depends_on:
      - scheduler
      - stats

volumes:
  db-data:
